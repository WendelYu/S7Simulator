name: Test, build and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate version, tag and release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/release.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  desktop:
    needs: version
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            arch: arm64
            python-arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
            python-arch: x64
          - os: windows-2022
            platform: windows
            arch: x64
            python-arch: x64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test codecs, UI and real S7 TCP connections
        run: python -m pytest -q
      - name: Build native app, installer and SHA256 checksums
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: python scripts/build.py
      - name: Start the packaged app and verify its version
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: python scripts/smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: S7Studio-v${{ needs.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/S7Studio-v${{ needs.version.outputs.version }}-*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: S7Studio-v${{ needs.version.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Verify all six packages and prepare the release body
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py --tag "$RELEASE_TAG" --verify-assets release-assets --notes build/release-notes.md
      - name: Upload all packages to a draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release already published; increment the version instead of replacing packages."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --notes-file build/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "S7 Studio $RELEASE_TAG" --notes-file build/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
